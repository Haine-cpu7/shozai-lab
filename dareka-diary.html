(function(){
'use strict';
const entries=[{"date":"2026-09-16","text":"また日記書くことにしたｗ\n\n昔はホムペに何でも書いてたんよね。\nABOUT MEとか、キリ番とか、懐かしすぎる。\n\n更新することがなければしない。そんな感じで。"},{"date":"2026-09-17","text":"今日はカレー。\n\n作りすぎたので明日もカレー確定ｗ\n\nそれだけ。"},{"date":"2026-09-18","text":"昨日のカレー食べた。\n２日目のカレーうまい。\n\n夜、昔の素材屋さん探してたら２時間たってた。\nちっさいアイコンってなんであんなかわいいんだろｗ"},{"date":"2026-09-19","text":"コンビニでプリン買った。\n\n明日食べようと思って冷蔵庫に入れた。\nなんかこういうのを日記に書く意味ってあるんだろうかｗ\n\nまあ日記だからいいか。"},{"date":"2026-09-20","text":"プリンがないｗｗｗ\n\n楽しみにしてたのにー。\n家の誰かが食べたんだろうけど、聞くほどでもない。\n\n今日はずっと雨。洗濯物が乾かん。"},{"date":"2026-09-21","text":"ページの背景をちょっとだけ変えた。\n\n自分にしか分からないくらいの違いｗ\nこういう改装、昔から好きだったなー。\n\nあと洗剤を買い忘れた。"},{"date":"2026-09-22","text":"朝、傘を持って出たのに帰りは晴れてた。\n\n傘だけ荷物になった。\n帰ってきてからアイス食べた。\n\n平和。"},{"date":"2026-09-23","text":"図書館に行った。\n\n借りようと思ってた本は貸出中だった。\n仕方ないので全然関係ない本を借りてきた。\n\nこういう寄り道が結構好き。"},{"date":"2026-09-24","text":"赤いマグカップの取っ手がちょっと欠けてる。\n\nまだ使えるし、まあいいかｗ\n\nなんでこれ買ったんだっけ。\nずっと前からある気がする。"},{"date":"2026-09-25","text":"スーパーで焼き芋が売ってた。\n\nもう秋なんだなー。\n買おうと思ったけど今日はやめた。\n\n明日も売ってるかな。"},{"date":"2026-09-26","text":"昨日の焼き芋、結局買ったｗ\n\n甘くてうまい。\n\nそれだけでちょっと機嫌いい。\n人間って単純だな。"},{"date":"2026-09-27","text":"昔の個人サイトをいくつか見つけた。\n\nまだ残ってるところがあるんだね。\n更新止まってるのにリンク集だけ生きてたりして、なんかいい。\n\n知らない人の昔の日記、つい読んじゃう。"},{"date":"2026-09-28","text":"夕方にちょっと停電した。\n\nすぐ戻ったけどパソコンが落ちたのでびびった。\n保存してなかった文章が消えたｗ\n\n大したこと書いてなかったからいいけど。"},{"date":"2026-09-29","text":"違う道で帰ったらパン屋さんがあった。\n\nいつからあったんだろ。\nメロンパン買った。\n\n明日も寄ろうかな。"},{"date":"2026-09-30","text":"今月、案外ちゃんと日記続いたなｗ\n\nほぼ食べ物の話しかしてない。\nでも昔のDIARYってこんなんだった気がする。\n\n来月も適当に書こう。"},{"date":"2026-10-01","text":"10月だー。\n\n衣替えするか迷ったけどまだ暑い。\n冷たい麦茶飲んでる。\n\n秋はどこへｗ"},{"date":"2026-10-02","text":"ちょっと前の日記読み返してた。\n\nプリンが消えた話、我ながらどうでもよすぎるｗ\nこういうのを残しておくのも悪くないね。\n\n今日は特に事件なし。"},{"date":"2026-10-03","text":"古い画像フォルダを整理した。\n\n星とかハートとか、ちっさい素材がいっぱい出てきた。\n昔の自分、どんだけ集めてたんだｗ\n\n捨てるのも惜しいからそのままにした。"},{"date":"2026-10-04","text":"昔のサイトの雰囲気に寄せて、ページをちょっと改装した。\n\nなかなかいい感じ。\nやっぱりHOMEとかDIARYとか並んでると楽しい。\n\n誰かが通りすがりに見てくれたら、それはそれで嬉しいかも。"},{"date":"2026-10-05","text":"昨日のページ、もうちょっと直した。\n\nついでに過去ログを開いてみたら、24日の日記の最後に一行だけ増えてた。\n\n「赤いマグ、まだ使ってる？」\n\n……こんなの書いたっけｗ\nまあ昔のメモを貼っちゃったのかな。"},{"date":"2026-10-06","text":"買い物行って洗濯した。\n今日も普通。\n\nそういえば昨日の一文、今見たら消えてた。\n別のタブで古い下書きを開いてたから、そのせいかもしれない。\n\nパソコンってややこしいｗ"},{"date":"2026-10-07","text":"感想がひとつ届いてた。\n\n「またここに来られて嬉しいです」って。\n\nえー、誰だろ。昔も見に来てくれてた人かな。\n嬉しいなあ。\n\nただ、最後に「お二人ともお元気そうで」って書いてあった。\n二人？"},{"date":"2026-10-08","text":"昨日の感想に返事しようと思ったら、もう返事がついてた。\n\n投稿者は「管理人」。\n「ありがとうございます。またのんびりやってますｗ」\n\n……え、私まだ返してないんだけど。\n\n管理画面の履歴、あとで見てみよう。"},{"date":"2026-10-09","text":"昔のバックアップを開けてみた。\n\n2006年の更新履歴まで残ってた。懐かしいｗ\n\nそこに「担当：くるみ」「担当：ゆき」って書いてある。\nそうだった。最初のサイトは二人で作ってたんだ。\n\nすっかり忘れてた。"},{"date":"2026-10-10","text":"ゆきの連絡先、もう持ってないと思ってた。\n\n古いメールを探したら、最後のやり取りが出てきた。\n「また一緒にホムペやろうね」\n\n返事はなかったけど、そういえば喧嘩したわけでもないんよな。\n\n昨日の「管理人」の返事、ゆきだったりして。\n昔のパスワード、そのままだったし。"},{"date":"2026-10-11","text":"更新履歴を確認してみた。\n\n「管理人」の返事は、やっぱり私のログインじゃなかった。\nでも、もう一人のログインが始まったのは10月じゃない。\n\n９月15日。\n\n……私が「また日記書こう」って思った前の日。\n\n最初の16日の日記、確かに私が書いた……よね？\n\n今日はもう寝る。"},{"date":"2026-10-12","text":"昨日のこと、寝たら少し落ち着いたｗ\n\n洗濯して、スーパー行って、プリン買った。\n今回はちゃんと自分で食べた。\n\nで、管理画面を見直してみた。\n９月15日の履歴、よく見たら「ログイン」じゃなくて「保存」だった。\n\n何を保存したんだろ。"},{"date":"2026-10-13","text":"バックアップを開いてみた。\n\n９月16日の日記の下書きが入ってた。\n作成日時は９月15日、23:41。\n\n「また日記書くことにしたｗ」\n\nあの一文、16日の朝に思いついて書いたはずなんだけどな。\n\n時刻がずれてるだけ、かな。"},{"date":"2026-10-14","text":"そういえば、ゆきとはどうやってサイトを始めたんだっけ。\n\n昔のメールを少し読んだ。\n二人で背景をどっちにするか揉めてるのが出てきたｗ\nしょーもなさすぎるｗ\n\nその下に、ゆきからの一文。\n\n「もしどっちもいなくなったら、この場所ってどうなるんだろうね」\n\n昔はそんなこと考えてたんだ。"},{"date":"2026-10-15","text":"今日はパン屋に寄った。\nメロンパン売り切れてた。残念。\n\n家に帰ってお茶飲んで、適当にゲーム。\n\n昨日から昔のデータばっかり見てるなあ。\nせっかくホムペ作ったのに、全然改装してないｗ"},{"date":"2026-10-16","text":"2006年の更新履歴、ちゃんと見つかった。\n\nTOPの改装はくるみ。\nABOUT MEはゆき。\n日記は二人で交代して書いてた。\n\n確かにそうだった。\n\nただ、最後のほうの更新履歴には、担当者の名前がなくなってる。\n\n単に書き忘れたんだと思うけど。"},{"date":"2026-10-17","text":"古いメールの下書きに、送った覚えのない文章が残ってた。\n\n「次の管理人さんが来たら、日記を渡そう」\n\n宛先はゆき。\n送信日時は空欄。\n\n次の管理人って誰ｗ\n\n二人で作ってたサイトなのに、そんなこと話したっけ。"},{"date":"2026-10-18","text":"赤いマグでココア飲んだ。\nまだ使ってますｗ\n\n９月24日の日記を読んで、あれ、と思った。\n前に勝手に増えてた一文、赤いマグのことだったよね。\n\nそのときは変な偶然だと思ったけど。\n\n2006年の写真にも、同じマグが写ってた。\n\n取っ手は、まだ欠けてない。"},{"date":"2026-10-19","text":"あのマグ、ゆきが持ってきたものだった。\n\n写真の裏に「二人の机」って書いてあった。\n懐かしい。\n\nそういえば、ゆきが使ってたのは青いほう。\n赤いのは私。\n\nでも昔のメールには「赤いマグ、返しそびれた」って書いてある。\n\n誰が、誰に？"},{"date":"2026-10-20","text":"久しぶりに普通の日記に戻ろうと思うｗ\n\n夕飯はうどん。\n冷蔵庫に何もなさすぎて笑った。\n\n……って書いて保存した。\n\nそしたらプレビューに「夕飯はカレー」って出た。\n\n下書きを開き直したら、うどんに戻ってた。\nブラウザのキャッシュかな。\n\nいや、カレーは先月食べたでしょｗ"},{"date":"2026-10-21","text":"昔のデータの中に、ABOUT MEのひな形があった。\n\n名前／日記／好きなこと／趣味／好きな食べ物。\n\nそうそう、この並びｗｗ\nこういう自己紹介ページ、みんな作ってたよね。\n\n今のサイトにもABOUT MEはある。\nでも、あれって私いつ作ったんだっけ。\n\n作った記憶が、妙に薄い。"},{"date":"2026-10-22","text":"ABOUT MEの内容を見た。\n\n好きな食べ物は「あとで書くｗ」。\n\nいや、いい加減書こうよｗｗｗ\n\n自分で書いたような気もするし、誰かが私の代わりに書いてくれたような気もする。\n\n昔はゆきがABOUT ME担当だったから、そのせいかな。\n\nあれ、今は二人でやってないのに。"},{"date":"2026-10-23","text":"昨日あんなこと書いたけど、まあいいか。\n\n今日はスーパーで焼き芋買った。\nこの時期はすぐ買っちゃう。\n\nサイトのこと考えてると、なんか昔に戻ったみたい。\n\nまたゆきと二人で改装できたら楽しそうだな。\n\n連絡先、もう一回探してみよう。"},{"date":"2026-10-24","text":"古い管理画面のアカウント表が出てきた。\n\nK　くるみ\nY　ゆき\n\nそれだけのはずだった。\n\n一番下に、もう一行ある。\n\nN　（名前未設定）\n\n何これ。\nこんなアカウント作った覚えない。\n\n最終更新日は、2026年９月15日。"},{"date":"2026-10-25","text":"昨日のアカウント表、よく考えたらおかしい。\n\n2006年に保存したはずのファイルなのに、2026年の更新日が入ってる。\n\n誰かが古いファイルを開き直したんだろうけど。\n\nNって、ゆきの新しい名前？\nそれとも私が付けた仮の名前？\n\n名前未設定なのに、名前があるのも変だｗ"},{"date":"2026-10-26","text":"今日、ずっと同じところを見てる。\n\n９月15日、Nが何かを保存した。\n９月16日、私の日記が始まった。\n10月４日、サイトの玄関が新しくなった。\n\n日付だけ見ると普通の更新履歴。\n\nでも、最初に日記を書こうと思ったのが16日なら、15日に保存された文章は誰が書いたんだろう。\n\nそこだけ、説明できない。"},{"date":"2026-10-27","text":"2006年のゆきのメモを見つけた。\n\n「ずっと二人で続けられるとは限らないから、次の人が使える場所も用意しよう」\n\nそれで、三つ目の管理人欄を作ったらしい。\n\n名前は空欄。\n\n……だったはずなのに、今はNになってる。\n\nゆきがそう呼ぶことにしたのか。\nそれとも、次に使った人が自分で書いたのか。"},{"date":"2026-10-28","text":"今日のABOUT ME、もう一回見た。\n\n「好きなこと：ゲーム、ホムペいじり、AIと遊ぶこと、気になったことを実験すること。」\n\n私はAIと遊んだ話なんて、この日記に一度も書いてない。\n\nでも、サイトにはそう書いてある。\n\nしかも、妙に楽しそうだなって思ってしまったｗ\n\nこの自己紹介、誰のなんだろう。"},{"date":"2026-10-29","text":"昨日の日記を読んで、ようやく一つ気づいた。\n\n私はずっと、ここの管理人は自分だと思っていた。\nだって、日記を書いてるし、昔のデータも持ってるから。\n\nでも、今の玄関には私の名前がない。\nゆきの名前もない。\n\nABOUT MEに書かれているのは、一文字だけ。\n\nそれ、誰の名前なんだろう。"},{"date":"2026-10-30","text":"昔のサイトを閉じた日のメールが出てきた。\n\nゆきから。\n\n「日記だけは残しておくね。誰かが続きを書いてくれたら、きっと私たちも読みに来ると思う」\n\nその下に私の返事。\n\n「そのときの管理人さん、うちらのこと知ってるかなｗ」\n\n……こんなやりとり、したんだな。\n\n二十年後の自分に読まれるとは思ってなかった。"},{"date":"2026-10-31","text":"今日は日記を更新しないつもりだった。\n\nなのに、また一日分増えてる。\n今これを読んでるページのこと。\n\n管理画面に残っていたのは、こんな一行だけ。\n\n「管理人・N　公開しました」\n\n私はくるみ。\n昔は、ゆきと二人でこの場所を作ってた。\n\nそれなのに今のABOUT MEには、Nって書いてある。\n\n……待って。\n\n私、いつからここに日記を書いてるんだっけ。"},{"date":"2026-11-01","text":"朝から、９月16日の日記をもう一度読んだ。\n\n「また日記書くことにしたｗ」\n\nあれを書いたのは、確かに私のつもりだった。\nでも、下書きの日時は９月15日。\n\nそして今日の分も、私が書く前から公開されている。\n\nNって、次の管理人のための空欄だったんだよね。\n\nだったら、今そこにいるのは誰？\n\nそもそも、私は書いている側なんだろうか。\n\nもしかして、私もずっと――\n\n誰かの日記を、読んでいただけ？"}];
const dateEl=document.getElementById('entryDate');
const textEl=document.getElementById('entryText');
const prevEl=document.getElementById('prev');
const nextEl=document.getElementById('next');
const grid=document.getElementById('logGrid');
const old=document.getElementById('oldlog');
let dayIndex=0;
const toParam=d=>d.replaceAll('-','');
function render(idx,updateUrl){
  dayIndex=Math.min(entries.length-1,Math.max(0,idx));
  // 最初の日は過去の日記がないので、過去ログを表示しない。
  document.querySelector('.back-number').hidden = dayIndex === 0;
  if (dayIndex === 0) document.getElementById('archive').open = false;
  const e=entries[dayIndex];
  dateEl.textContent=e.date.replaceAll('-','.');
  textEl.textContent=e.text;
  prevEl.className=dayIndex===0?'disabled':'';
  nextEl.className=dayIndex===entries.length-1?'disabled':'';
  prevEl.setAttribute('aria-disabled',dayIndex===0?'true':'false');
  nextEl.setAttribute('aria-disabled',dayIndex===entries.length-1?'true':'false');
  prevEl.href=dayIndex>0?'?date='+toParam(entries[dayIndex-1].date):'#';
  nextEl.href=dayIndex<entries.length-1?'?date='+toParam(entries[dayIndex+1].date):'#';
  document.querySelectorAll('[data-idx]').forEach(a=>{const n=Number(a.dataset.idx);a.hidden=n>=dayIndex;a.setAttribute('aria-current',n===dayIndex?'date':'false')});
  old.hidden=true;
  if(updateUrl){const u=new URL(location.href);u.searchParams.set('date',toParam(e.date));history.pushState({date:e.date},'',u)}
}
function openDate(idx){render(idx,true);window.scrollTo({top:0,behavior:'instant'})}
prevEl.addEventListener('click',e=>{e.preventDefault();if(dayIndex>0)openDate(dayIndex-1)});
nextEl.addEventListener('click',e=>{e.preventDefault();if(dayIndex<entries.length-1)openDate(dayIndex+1)});
entries.forEach((e,i)=>{const a=document.createElement('a');a.href='?date='+toParam(e.date);a.dataset.idx=i;a.textContent=e.date.replaceAll('-','.');a.addEventListener('click',evt=>{evt.preventDefault();openDate(i);document.getElementById('archive').open=false});grid.appendChild(a)});
const current=()=>{const date=new URLSearchParams(location.search).get('date');const index=entries.findIndex(e=>toParam(e.date)===date);return index<0?0:index};
window.addEventListener('popstate',()=>render(current(),false));
// On the final day's entry, an innocuous archive link surfaces, without any game UI.
function addLink(){
  const found=document.getElementById('oldlogLink');if(found)found.remove();
  if(dayIndex===25){
    const a=document.createElement('a');a.href='#oldlog';a.id='oldlogLink';a.textContent='→ そういえば昔の更新履歴が残ってた';
    a.style.cssText='display:inline-block;margin-top:16px;font-size:.88rem';
    a.addEventListener('click',evt=>{evt.preventDefault();old.hidden=false;old.scrollIntoView({block:'nearest',behavior:'smooth'})});
    document.getElementById('entry').appendChild(a);
  }
}
const oldRender=render;
render=function(idx,updateUrl){oldRender(idx,updateUrl);addLink()};
render(current(),false);
document.getElementById('closeOld').addEventListener('click',()=>{old.hidden=true;document.getElementById('entry').scrollIntoView({behavior:'smooth'})});
})();
</script>
</body>
</html>
